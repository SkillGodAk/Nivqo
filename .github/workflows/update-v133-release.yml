name: Update v1.33.0 release notes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-v133-release.yml"

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release.md <<'NIVQO_RELEASE_EOF'
          # Nivqo v1.33.0
          
          ## 繁體中文
          
          這個版本將 Nivqo Manager 從 Morphe Manager 1.32.0 **同步到正式 Morphe Manager 1.33.0**，並同步 Morphe Patcher 到 **1.15.0**。
          
          ### 主要更新
          
          - 同步 Morphe Manager `1.33.0`
          - 同步 Morphe Patcher `1.15.0`
          - 跟進 Morphe 1.33.0 新版 UI、App 語言系統、內容翻譯、新版 patching flow 與 split 合併效能改善
          - 保留 Nivqo 自己的 `app.nivqo.manager` package、GitHub Manager 更新通道與插件核心更新通道
          - 持續不使用原 Morphe Firebase / Google Services；背景更新維持 WorkManager
          - 內建離線核心：HushFacebook `0.5.0-nivqo.1`、HushMessenger `0.6.0-nivqo.1`
          
          ### 內建核心更新
          
          Nivqo Manager v1.33.0 已內建目前正式的離線核心：
          
          - HushFacebook `0.5.0-nivqo.1` — **54 個 patch**
          - HushMessenger `0.6.0-nivqo.1` — **28 個 patch entry**
          
          內建 bundle 主要用於離線或第一次啟動；之後若 GitHub 核心更新通道已有更新版本，Manager 會使用更新後的核心，不會由內建版本覆蓋。
          
          #### HushFacebook `0.5.0-nivqo.1`
          
          主要新增／更新：
          
          - 隱藏 Reels 分頁與 Reels 未讀圓點
          - 記住 Reel 播放速度
          - 長按 Reel 以 2x 播放
          - 可設定影片／Reels 預設播放畫質
          - 可關閉雙擊 Reel／影片按讚
          - Facebook 頂部 Messenger 按鈕可直接開啟 Messenger App
          - 支援匿名觀看 Stories
          - 強化 Marketplace 搜尋廣告過濾
          - 改善 Stories、Reels、VP9 等媒體下載品質與相容性
          - 改善 AMOLED / Material You 外觀
          - 改善 Facebook / Messenger 使用相同簽署 key 時的互通
          - 最新 patch 名稱與說明均已補齊繁體中文
          
          目前支援 Facebook：
          
          | Facebook 版本 | versionCode | 架構 |
          | --- | ---: | --- |
          | `580.0.0.51.74` | `475019344` | arm64-v8a |
          | `577.0.0.50.72` | `474426275` | arm64-v8a |
          
          #### HushMessenger `0.6.0-nivqo.1`
          
          主要新增／更新：
          
          - HushMessenger 設定正式整合到 Messenger「選單」分頁
          - 長按 Messenger 圖示可使用 Patch controls / Restart Messenger
          - 可隱藏獨立的 HushMessenger 設定 App 圖示
          - 隱藏 Meta AI 與相關入口
          - 支援系統 Emoji
          - Allow screenshots / Hide read receipts / Keep unsent messages 等隱私控制
          - 原始畫質照片傳送支援
          - 改善 Facebook / Messenger 使用相同簽署 key 時的互通
          - Messenger 語言可選擇「跟隨系統 / 繁體中文 / English」，選擇後按「套用」
          - 最新 patch 名稱與說明均已補齊繁體中文
          - Messenger `580.0.0.49.91` 的 arm64 相容範圍已擴充至 **21 個 versionCode**
          
          目前支援 Messenger `580.0.0.49.91`（arm64-v8a）：
          
          `346013354` / `346013355` / `346013356` / `346013357` / `346013358` / `346013359` / `346013370` / `346013372` / `346013374` / `346013375` / `346013387` / `346013391` / `346013394` / `346013423` / `346013427` / `346013440` / `346013441` / `346013442` / `346013443` / `346013444` / `346013445`
          
          > **請以 APK 的 versionCode 為準，不能只看 Facebook / Messenger 顯示的大版本名稱。**
          >
          > 本專案不重新散布 Facebook 或 Messenger 完整 APK；請自行取得符合上述 versionCode 的原始 APK 再進行修補。
          
          ### 繁中 patch 名稱／說明修正
          
          - HushFacebook：**54 / 54** patch 名稱與說明繁體中文
          - HushMessenger：**28 / 28** patch entry 名稱與說明繁體中文
          - 繁中固定 metadata 已配合 Morphe 1.33.0 的 App 語言系統
          - 其他語言仍可使用 Morphe 1.33.0 原生內容翻譯功能
          
          ### APK
          
          `Nivqo-Manager-1.33.0-20261001-release.apk`
          
          SHA-256：
          
          `10C260C3C820083A763F0980AFAA701913BF9B5A2772A3ED064FE7BEFEC60A74`
          
          Package：`app.nivqo.manager`  
          Version code：`39856514`
          
          與 v1.32.0 使用相同 Nivqo Manager release signing certificate，可直接更新安裝。
          
          ---
          
          ## English
          
          Nivqo Manager is now synced to stable **Morphe Manager 1.33.0**, with Morphe Patcher updated to **1.15.0**.
          
          ### Bundled offline cores
          
          - HushFacebook `0.5.0-nivqo.1` — **54 patches**
          - HushMessenger `0.6.0-nivqo.1` — **28 patch entries**
          
          The bundled cores are offline / first-launch seeds. Newer cores delivered through Nivqo's GitHub core channel take precedence.
          
          HushFacebook adds or updates Reels controls, persistent reel speed, hold-for-2x playback, default playback quality, double-tap-like control, Messenger top-bar launch, anonymous Story viewing, Marketplace filtering, media download compatibility, theme improvements and same-signing-key Facebook/Messenger interoperability.
          
          Supported Facebook arm64-v8a builds:
          
          - `580.0.0.51.74` — versionCode `475019344`
          - `577.0.0.50.72` — versionCode `474426275`
          
          HushMessenger includes the in-Messenger settings row, Patch controls / Restart Messenger shortcuts, optional hidden settings icon, Meta AI controls, system emoji, privacy controls, original-quality photo support, same-key Facebook interoperability, and Nivqo's `Follow system / Traditional Chinese / English` language selector.
          
          Supported Messenger `580.0.0.49.91` arm64-v8a versionCodes:
          
          `346013354`, `346013355`, `346013356`, `346013357`, `346013358`, `346013359`, `346013370`, `346013372`, `346013374`, `346013375`, `346013387`, `346013391`, `346013394`, `346013423`, `346013427`, `346013440`, `346013441`, `346013442`, `346013443`, `346013444`, `346013445`
          
          Always verify the exact APK `versionCode`; the visible version name alone is not sufficient.
          
          Nivqo does **not** redistribute complete Facebook or Messenger APKs. Obtain a compatible original APK separately and patch it locally.
          
          ### Localization
          
          - HushFacebook patch metadata: **54 / 54** localized in Traditional Chinese
          - HushMessenger patch metadata: **28 / 28** localized in Traditional Chinese
          - Keeps Nivqo's package, Manager/core update channels and WorkManager background checks
          - Keeps Firebase / Google Services removed
          
          APK: `Nivqo-Manager-1.33.0-20261001-release.apk`  
          SHA-256: `10C260C3C820083A763F0980AFAA701913BF9B5A2772A3ED064FE7BEFEC60A74`
          NIVQO_RELEASE_EOF
          jq -n --rawfile body /tmp/release.md '{name:"Nivqo v1.33.0", body:$body}' > /tmp/payload.json
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/400230767" --input /tmp/payload.json
